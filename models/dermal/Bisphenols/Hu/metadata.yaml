- level: error
  msg: "The units of the 'math' formula in a <kineticLaw> definition are expected\
    \ to be the equivalent of _substance per time_.\nReference: L3V2 Sections 4.11.7,\
    \ 4.2.3 AND 4.9.4\n In level 3 the expected units are extent_per_time. Expected\
    \ units are mole (exponent = 1, multiplier = 1, scale = -9), second (exponent\
    \ = -1, multiplier = 3600, scale = 0) but the units returned by the <math> expression\
    \ in the <kineticLaw> (from the <reaction> with id '_J10') are mole (exponent\
    \ = 1, multiplier = 1e-09, scale = 0), litre (exponent = -1, multiplier = 1, scale\
    \ = 0)."
