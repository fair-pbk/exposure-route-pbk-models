scenarios:
  - id: dermal_scenario_1
    label: Dermal Scenario 1
    duration: 10
    evaluation_resolution: 24
    time_unit: DAY
    amount_unit: MILLIGRAMS
    molar_mass: 228.3
    dosing_events:
      - type: repeated_continuous
        target: Dermal
        amount: 1000
        time: 0
        interval: 1
        duration: 8
    outputs:
      - id: Dermal
        label: Dermal exposure
        output: Dermal exposure
      - id: APlasma
        label: Amount in Plasma
        output: APlasma
      - id: CPlasma
        label: Concentration in Plasma
        output: CPlasma
